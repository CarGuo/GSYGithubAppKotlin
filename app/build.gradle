afterEvaluate {
    ['Debug', 'Release'].each { variantName ->
        def variantLower = variantName.uncapitalize()
        def dbTask = tasks.findByName("dataBindingGenBaseClasses${variantName}")
        def kspTask = tasks.findByName("ksp${variantName}Kotlin")
        if (dbTask == null || kspTask == null) {
            return
        }

        def srcOut = file("build/generated/data_binding_base_class_source_out/${variantLower}/out")
        def brOutDir = file("build/generated/source/br_stub/${variantLower}")

        def genBrTask = tasks.register("generateBrStub${variantName}") {
            outputs.dir(brOutDir)
            doLast {
                if (brOutDir.exists()) {
                    brOutDir.deleteDir()
                }
                def brFields = new TreeSet<String>()
                fileTree(dir: 'src/main/java', include: '**/*.kt').each { f ->
                    f.text.findAll(/BR\.(\w+)/) { match, name -> brFields.add(name) }
                }
                fileTree(dir: srcOut, include: '**/*.java').each { f ->
                    f.text.findAll(/BR\.(\w+)/) { match, name -> brFields.add(name) }
                }
                def pkgDir = new File(brOutDir, 'com/shuyu/github/kotlin')
                pkgDir.mkdirs()
                def br = new File(pkgDir, 'BR.kt')
                def sb = new StringBuilder()
                sb.append('package com.shuyu.github.kotlin\n\n')
                sb.append('object BR {\n')
                sb.append('    const val _all: Int = 0\n')
                int i = 1
                brFields.each { name ->
                    if (name != '_all') {
                        sb.append("    const val ${name}: Int = ${i}\n")
                        i++
                    }
                }
                sb.append('}\n')
                br.text = sb.toString()
            }
        }

        genBrTask.configure { dependsOn(dbTask) }
        kspTask.dependsOn(dbTask, genBrTask)
        kspTask.kspConfig.javaSourceRoots.from(srcOut, brOutDir)

        def compileKotlinTask = tasks.findByName("compile${variantName}Kotlin")
        if (compileKotlinTask != null) {
            compileKotlinTask.dependsOn(genBrTask)
            compileKotlinTask.source(brOutDir)
            // 编译完成后删除 Kotlin 端 BR.class，避免与 javac/dataBinding 产生的 BR.class 在 dex 阶段重复
            compileKotlinTask.doLast {
                def kotlinBr = file("${compileKotlinTask.destinationDirectory.get().asFile}/com/shuyu/github/kotlin/BR.class")
                if (kotlinBr.exists()) {
                    kotlinBr.delete()
                    logger.lifecycle("[databinding-fix] removed kotlin BR.class to avoid dex duplication: ${kotlinBr}")
                }
            }
        }
        def compileJavaTask = tasks.findByName("compile${variantName}JavaWithJavac")
        if (compileJavaTask != null) {
            compileJavaTask.dependsOn(genBrTask)
            // AGP 9 不再自动把 Kotlin 输出加入 javac classpath，导致 dataBinding 注解处理器看不到 Kotlin 写的 BindingAdapter
            if (compileKotlinTask != null) {
                compileJavaTask.dependsOn(compileKotlinTask)
                def kotlinClassesDir = compileKotlinTask.destinationDirectory
                compileJavaTask.doFirst {
                    def existing = compileJavaTask.classpath
                    compileJavaTask.classpath = files(kotlinClassesDir) + existing
                    logger.lifecycle("[databinding-fix] javac classpath prepended with kotlin classes: ${kotlinClassesDir.get().asFile}")

                    // KSP 不会把 Kotlin @Bindable 暴露给 dataBinding，导致 dataBinding 生成的 BR.java
                    // 缺少 @Bindable 字段。扫描 Kotlin 源码中所有 @Bindable + var 名 + BR.xxx 引用，
                    // 把缺失字段追加到 dataBinding 已生成的 BR.java，让 javac 在编译阶段能解析 BR.image 等。
                    def brJava = file("build/generated/ap_generated_sources/${variantLower}/out/com/shuyu/github/kotlin/BR.java")
                    if (brJava.exists()) {
                        def text = brJava.text
                        def existingFields = new HashSet<String>()
                        (text =~ /public static final int (\w+) =/).each { m -> existingFields.add(m[1]) }
                        def referenced = new TreeSet<String>()
                        // 扫描 Kotlin 源中 @Bindable 修饰的属性名
                        def bindablePattern = ~/(?s)@Bindable\s*\n\s*(?:get\(\)\s*=\s*field\s*\n\s*set\(value\)\s*\{[^}]*\}\s*\n\s*)?\s*/
                        fileTree(dir: 'src/main/java', include: '**/*.kt').each { f ->
                            def src = f.text
                            // 匹配 var name: ... 后接 @Bindable 形式（属性的 backing-field 注解）
                            def varBindable = src =~ /(?ms)var\s+(\w+)\s*:[^\n]*\n\s*@Bindable/
                            varBindable.each { match -> referenced.add(match[1]) }
                            // 也扫 BR.xxx 引用
                            src.findAll(/BR\.(\w+)/) { match, name -> referenced.add(name) }
                        }
                        def missing = referenced.findAll { !existingFields.contains(it) && it != '_all' }
                        if (!missing.isEmpty()) {
                            def insertion = new StringBuilder()
                            int next = (text =~ /public static final int \w+ = (\d+);/).collect { it[1] as int }.max() ?: 0
                            missing.each { name ->
                                next++
                                insertion.append("\n  public static final int ${name} = ${next};\n")
                            }
                            def patched = text.replaceFirst(/(?s)\}\s*\z/, insertion.toString() + '}\n')
                            brJava.text = patched
                            logger.lifecycle("[databinding-fix] patched BR.java with ${missing.size()} missing fields: ${missing}")
                        }
                    }
                }
            }
        }
    }
}

android.sourceSets.configureEach { ss ->
    // 不再把 BR 桩注入到 main sourceSet，避免被 javac/dataBinding 重复识别
}

// BR.kt 桩仅给 Kotlin 编译使用（KSP 与 compileKotlin 都会读取 kotlin sourceSet），
// 不会被 javac 的 dataBinding 注解处理器拾取，因此与 dataBinding 自身写 BR.java 不冲突
afterEvaluate {
    def kotlinExt = extensions.findByName('kotlin')
    if (kotlinExt != null) {
        try {
            def mainSrc = kotlinExt.sourceSets.findByName('main')
            if (mainSrc != null) {
                mainSrc.kotlin.srcDir("build/generated/source/br_stub/debug")
                mainSrc.kotlin.srcDir("build/generated/source/br_stub/release")
            }
        } catch (Throwable ignored) { }
    }
}
