plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

android {
    namespace 'com.shuyu.github.kotlin'
    compileSdk 36

    ///是否需要测试 CMake
    Properties properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
    def needCMakeTest = properties.getProperty("NEED_CMAKE_TEST", "false").toBoolean()

    defaultConfig {
        applicationId "com.shuyu.github.kotlin"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 12
        versionName "1.3.0"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [AROUTER_MODULE_NAME: project.getName()]
            }
        }

        buildConfigField "String", "CLIENT_ID", properties.getProperty("CLIENT_ID")
        buildConfigField "String", "CLIENT_SECRET", properties.getProperty("CLIENT_SECRET")
        buildConfigField "boolean", "NEED_CMAKE_TEST", "$needCMakeTest"

        if (needCMakeTest) {
            //CMake
            externalNativeBuild {
                cmake {
                    cppFlags ""
                }
                ndk {
                    abiFilters 'arm64-v8a'
                }
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    if (needCMakeTest) {
        externalNativeBuild {
            cmake {
                path 'CMakeLists.txt'
            }
        }
    }

    ksp {
        arg("AROUTER_MODULE_NAME", project.getName())
    }

    sourceSets.configureEach { srcSet ->
        srcSet.java.srcDir("build/generated/data_binding_base_class_source_out/${srcSet.name}/out")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    //打开 dataBinding 和 viewBinding
    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
        aidl true
    }

    signingConfigs {
        debug {
            storeFile file("../gsygithubapp-debug.jks")
            storePassword "123456"
            keyAlias "debug"
            keyPassword "123456"
        }
        release {
            storeFile file("../gsygithubapp-debug.jks")
            storePassword "123456"
            keyAlias "debug"
            keyPassword "123456"
        }
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
        }
    }

    lint {
        abortOnError false
    }

    //针对编辑错误
    configurations {
        cleanedAnnotations
        compile.exclude group: 'org.jetbrains', module: 'annotations'
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/library-core_release.kotlin_module',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt'
            ]
        }
    }
}

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        freeCompilerArgs.addAll(
                "-Xjvm-default=all"
        )
    }
}

// AGP 9 dataBinding-compiler 已编译为 JDK 21+ 字节码，需要 javac 使用 21+ 的 JDK 来跑注解处理器
def javaToolchains = extensions.getByType(JavaToolchainService.class)
def javacLauncher21 = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}
def javacCompiler21 = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(21)
}
tasks.withType(JavaCompile).configureEach {
    javaCompiler = javacCompiler21
}

