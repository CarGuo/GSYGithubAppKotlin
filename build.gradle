// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.2.10'
    ext.ksp_version = '2.2.10-2.0.2'
    ext.ktx_version = '1.13.1'
    ext.androidx_appcompat = '1.7.0'
    ext.material_version = '1.12.0'
    ext.recyclerview_version = '1.3.2'
    ext.legacy_support_version = '1.0.0'
    ext.annotation_version = '1.8.2'
    ext.constraint_version = '2.1.4'
    ext.navigation_version = '2.7.7'
    ext.lifecycle_version = '2.8.4'
    ext.room_version = '2.6.1'
    ext.startup_version = '1.2.0'
    ext.drawerlayout_version = '1.2.0'
    ext.retrofit_version = '2.11.0'
    ext.okhttp3_version = '4.12.0'
    ext.rx_version = '2.2.21'
    ext.rx_android = '2.1.1'
    ext.event_bus = '3.3.1'
    ext.glide_version = '4.16.0'
    ext.dagger_version = '2.59.2'
    ext.hilt_version = '2.59.2'
    ext.iconics_version = '5.4.0'
    ext.agentweb_version = '4.1.9-androidx'
    ext.recycler_common_version = '4.0.6'
    ext.drop_menu_version = '1.0.4'
    ext.arouter_api_version = '1.5.2'
    ext.arouter_compiler_version = '1.5.2'
    ext.richtext_version = '0.19.0'
    ext.markwon_version = '4.6.2'
    ext.prism4j_version = '2.0.0'
    ext.dialogplus_version = '1.11@aar'
    ext.lottie_version = '6.4.0'
    ext.photoview_version = '2.3.0'
    ext.spinkit_version = '1.4.0'
    ext.textfiled_box_version = '1.4.5'
    ext.gradle_version = '9.0.0-alpha14'

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://jitpack.io" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$ksp_version"

        // NOTE: Do not place your application dependencies here; they belong

        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://jitpack.io" }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
