// 仓库使用 Gradle 标准仓库（mavenCentral / google / gradlePluginPortal）。
// 国内开发者如需加速，请在 ~/.gradle/init.d/repo-mirror.gradle 中按需添加 aliyun 等镜像，
// 不要再写到仓库内 settings.gradle —— Gradle 9 在镜像 5xx 时会直接 disable 该仓库导致 CI 整体失败。
pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

rootProject.name = "GSYGithubAppKotlin"
include ':app'
